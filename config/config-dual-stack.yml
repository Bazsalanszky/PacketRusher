# PacketRusher Simulated gNodeB Configuration, dual-stack on N2 and N3.
# The PDU sessions are still those of ue.pdusessiontype, IPv4 by default: their IP
# version is independent of N2 and N3.
gnodeb:
  # IPv4 and IPv6 Addresses on the N2 Interface (e.g. used between the gNodeB and
  # the AMF): each AMF of amfif is reached from the address of its IP version.
  controlif:
    ip: "192.0.2.10"
    ipv6: "2001:db8:620::10"
    port: 9487

  # IPv4 and IPv6 Addresses on the N3 Interface (e.g. used between the gNodeB and
  # the UPF). A UPF may signal an IPv4 address, an IPv6 one or both (TS 38.414
  # §5.1); the gNB uses the one of an IP version it has.
  #
  # With the gtp5g tunnel backend, which carries GTP-U over IPv4 only, the gNB uses
  # its IPv4 address alone.
  dataif:
    ip: "192.0.2.20"
    ipv6: "2001:db8:630::10"
    port: 2152
    # Of a UPF that signals both: ipv4 (the default) or ipv6.
    preferredfamily: ipv4
    # What the gNB signals as its own N3 address: "selected" (the default), its
    # address of the IP version it uses towards the UPF, so that the downlink comes
    # in that version; or "all", both addresses in 160 bits, leaving the choice of
    # the downlink's IP version to the core. A tunnel only receives in the version
    # of its uplink, so "all" is for signalling tests, e.g. of the core's decoding.
    advertise: selected

  # gNodeB's Identity
  plmnlist:
    mcc: "208"
    mnc: "93"
    tac: "000001"
    # gNB ID width in bits (22-32); cellid fills the rest of the 36-bit NR cell identity.
    gnbidlength: 24
    cellid: 0
    gnbid: "000008"

  # gNodeB's Supported Slices
  slicesupportlist:
    sst: "01"
    sd: "000001" # optional, can be removed if not used

# PacketRusher Simulated UE Configuration
ue:
  # UE's Identity, frequently called IMSI in 4G and before
  # IMSI format is "<mcc><mnc><msin>"
  # In 5G, the SUPI of the UE will be "imsi-<mcc><mnc><msin>""
  # With default configuration, SUPI will be imsi-208930000000120
  hplmn:
    mcc: "208"
    mnc: "93"
  msin: "0000000120"

  # In 5G, the UE's identity to the AMF as a SUCI (Subscription Concealed Identifier)
  #
  # SUCI format is suci-<supi_type>-<MCC>-<MNC>-<routing_indicator>-<protection_scheme>-<public_key_id>-<scheme_output>
  # With default configuration, SUCI sent to AMF will be suci-0-999-70-0000-0-0-0000000120
  #
  # SUCI Routing Indicator allows the AMF to route the UE to the correct UDM
  routingindicator: "0000"
  #
  # SUCI Protection Scheme: 0 for Null-scheme, 1 for Profile A and 2 for Profile B
  protectionScheme: 0
  #
  # Home Network Public Key
  # Ignored with default Null-Scheme configuration
  homeNetworkPublicKey: "5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650"
  #
  # Home Network Public Key ID
  # Ignored ith default Null-Scheme configuration
  homeNetworkPublicKeyID: 1
  
  # IP version of the PDU sessions: IPv4 (default), IPv6 or IPv4v6.
  pdusessiontype: IPv4

  # Inner IPv4 tunnel MTU. 0 uses the N3 interface MTU minus 44 bytes.
  # Set a smaller value, e.g. 1400, to match the UPF or a lower path MTU.
  tunnelmtu: 0

  # UE's SIM credentials
  key: "00112233445566778899AABBCCDDEEFF"
  opc: "00112233445566778899AABBCCDDEEFF"
  amf: "8000"
  sqn: "00000000"

  # UE will request to establish a data session in this DNN (APN)
  dnn: "internet"
  # in the following slice
  snssai:
    sst: "01"
    sd: "000001" # optional, can be removed if not used

  # The UE's security capabilities that will be advertised to the AMF
  integrity:
    nia0: false
    nia1: false
    nia2: true
    nia3: false
  ciphering:
    # For debugging Wireshark traces, NEA0 is recommended, as the NAS messages 
    # will be sent in cleartext, and be decipherable in Wireshark.
    nea0: true
    nea1: false
    nea2: true
    nea3: false

# List of AMF that PacketRusher will try to connect to, of either IP version
amfif:
  - ip: "192.0.2.1"
    port: 38412
  - ip: "2001:db8:620::1"
    port: 38412
logs:
  level: 4
